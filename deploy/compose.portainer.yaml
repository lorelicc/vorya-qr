# Vorya QR 0.2 — Portainer CE, Git stack, Docker Standalone.
# Compose path from the Git root: deploy/compose.portainer.yaml
# Build contexts are relative to this deploy/ folder. See deploy/PORTAINER.md.
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vorya_qr}
      POSTGRES_DB: ${POSTGRES_DB:-vorya_qr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Inserire POSTGRES_PASSWORD nelle variabili dello stack Portainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  migrate:
    # One-shot: applies Alembic migrations, then exits. The backend starts only if it succeeds.
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    command: ["python", "-m", "app.migrate"]
    environment: &backend_environment
      # Use a URL-safe password: letters, digits, _ and - (see PORTAINER.md).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vorya_qr}:${POSTGRES_PASSWORD:?Inserire POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vorya_qr}
      APP_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Impostare PUBLIC_BASE_URL (es. https://qr.vorya.it)}
      SHORT_LINK_BASE_URL: ${SHORT_LINK_BASE_URL:?Impostare SHORT_LINK_BASE_URL (es. https://qr.vorya.it)}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-true}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-supporto@vorya.it}
      MAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST:-smtps.aruba.it}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@vorya.it}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Vorya QR}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
      # 0.2: uploaded files (local volume by default, or any S3-compatible service).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /data/uploads
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-vorya-qr/}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      # 0.2: approximate scan places (DB-IP Lite, downloaded with `python -m app.cli download-geoip`).
      GEOIP_DB_PATH: /data/geoip/dbip-city-lite.mmdb
      # 0.2: Google Safe Browsing key; empty = check skipped (logged).
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
      # 0.3: Stripe. Only keys; plan prices are linked from /admin/billing (never in env or code).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_LIVE_ALLOWED: ${STRIPE_LIVE_ALLOWED:-false}
      # 0.5: errors (GlitchTip DSN), detailed health token, JSON logs.
      SENTRY_DSN: ${SENTRY_DSN:-}
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    # Same build as `migrate` (Docker layer cache makes the second build immediate).
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    # 0.5: several processes; one uvicorn process saturates at ~150 redirects/s (see docs/V05.md).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header", "--workers", "${BACKEND_WORKERS:-3}"]
    environment: *backend_environment
    volumes:
      - uploads_data:/data/uploads
      - geoip_data:/data/geoip
    networks: [app, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    # 0.2: periodic jobs (purges after 30 days, expired transfers, salt rotation, stats retention).
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    command: ["python", "-m", "app.worker"]
    environment: *backend_environment
    volumes:
      - uploads_data:/data/uploads
      - geoip_data:/data/geoip
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # 0.5: inlined at BUILD time (client bundle + CSP). Changing them needs a rebuild.
        NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_ADS_ENABLED: ${NEXT_PUBLIC_ADS_ENABLED:-false}
        NEXT_PUBLIC_GOOGLE_ADS_ID: ${NEXT_PUBLIC_GOOGLE_ADS_ID:-}
        NEXT_PUBLIC_GOOGLE_ADS_CONVERSION: ${NEXT_PUBLIC_GOOGLE_ADS_CONVERSION:-}
    pull_policy: build
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      # Loopback only. Change VORYA_QR_HTTP_PORT if 3200 is taken (and update CloudPanel).
      - "127.0.0.1:${VORYA_QR_HTTP_PORT:-3200}:3000"
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---- 0.5 production services. Enable with COMPOSE_PROFILES=analytics,errors,backup ----
  # Their secrets are optional here (the stack must deploy without them); each service refuses to
  # start with empty ones: set the variables BEFORE enabling its profile.
  # They share the app's Postgres server with SEPARATE databases and roles (db-init): one container
  # less, one backup, ~300 MB of RAM saved. Each role has a connection limit so a burst of errors
  # in GlitchTip can never starve the app database.
  db-init:
    image: postgres:17-bookworm
    profiles: ["analytics", "errors"]
    entrypoint: ["/bin/sh", "/db-init.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vorya_qr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Inserire POSTGRES_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:-}
      GLITCHTIP_DB_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-}
    volumes:
      - ./db-init.sh:/db-init.sh:ro
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  umami:
    # Privacy-friendly site analytics (MIT), no cookies. Behind its own CloudPanel site.
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: ["analytics"]
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
    ports:
      - "127.0.0.1:${UMAMI_HTTP_PORT:-3300}:3000"
    networks: [app, data]
    depends_on:
      db-init:
        condition: service_completed_successfully
    mem_limit: 400m
    restart: unless-stopped

  glitchtip-web:
    # Error tracking (MIT), compatible with the Sentry SDKs.
    image: glitchtip/glitchtip:latest
    profiles: ["errors"]
    environment: &glitchtip_env
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:-}@db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}
      PORT: "8000"
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-https://errori.vorya.it}
      DEFAULT_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@vorya.it}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      ENABLE_USER_REGISTRATION: "false"
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "30"
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    ports:
      - "127.0.0.1:${GLITCHTIP_HTTP_PORT:-3400}:8000"
    networks: [app, data]
    depends_on:
      db-init:
        condition: service_completed_successfully
    mem_limit: 600m
    restart: unless-stopped

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    profiles: ["errors"]
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip_env
    networks: [data]
    depends_on:
      glitchtip-web:
        condition: service_started
    mem_limit: 500m
    restart: unless-stopped

  backup:
    # pg_dump + uploads -> restic (encrypted) -> S3-compatible storage outside the VPS.
    build:
      context: ./backup
    pull_policy: build
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-vorya_qr}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Inserire POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-vorya_qr}
      EXTRA_DATABASES: ${BACKUP_EXTRA_DATABASES:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_CRON: ${BACKUP_CRON:-15 3 * * *}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - uploads_data:/data/uploads:ro
    networks: [app, data]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
  uploads_data:
  geoip_data:
