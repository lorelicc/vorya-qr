name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · ruff + pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: vorya_qr_test
          POSTGRES_PASSWORD: ci_${{ github.run_id }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d vorya_qr_test"
          --health-interval=5s --health-timeout=3s --health-retries=15
    env:
      # Ephemeral CI database only; no real credential is used.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci_${{ github.run_id }}@127.0.0.1:5432/vorya_qr_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.*
      - name: System libraries (cairo renders the QR SVG to PNG/PDF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  frontend:
    name: Frontend · ESLint + Prettier + typecheck + Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end · Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: vorya_qr_e2e
          POSTGRES_PASSWORD: ci_${{ github.run_id }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d vorya_qr_e2e"
          --health-interval=5s --health-timeout=3s --health-retries=15
    env:
      E2E_DATABASE_URL: postgresql+psycopg://postgres:ci_${{ github.run_id }}@127.0.0.1:5432/vorya_qr_e2e
      PYTHON: python
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.*
      - name: System libraries (cairo renders the QR SVG to PNG/PDF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - run: pip install -r backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker · build images + compose config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image from a clean checkout
        run: docker build --progress=plain --tag vorya-qr-${{ matrix.service }}:ci ./${{ matrix.service }}
      - name: Trivy · scan image (blocks on CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            vorya-qr-${{ matrix.service }}:ci
      - name: Validate compose files
        if: matrix.service == 'backend'
        run: |
          docker compose -f deploy/compose.portainer.yaml --env-file deploy/.env.example config -q
          POSTGRES_PASSWORD=ci docker compose config -q

  lighthouse:
    name: Lighthouse · performance ≥ 90, SEO = 100, accessibility ≥ 95
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: vorya_qr_lh
          POSTGRES_PASSWORD: ci_${{ github.run_id }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d vorya_qr_lh"
          --health-interval=5s --health-timeout=3s --health-retries=15
    env:
      E2E_DATABASE_URL: postgresql+psycopg://postgres:ci_${{ github.run_id }}@127.0.0.1:5432/vorya_qr_lh
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.*
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - run: pip install -r backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: ./scripts/lighthouse.sh
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          retention-days: 14
