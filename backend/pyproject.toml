[project]
name = "vorya-qr-backend"
version = "0.2.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# SVG markup templates read better on one line each.
"app/qr/designer.py" = ["E501"]
"app/redirect/pages.py" = ["E501"]  # inline HTML and SVG

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
