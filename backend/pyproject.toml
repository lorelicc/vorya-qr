[project]
name = "vorya-qr-backend"
version = "0.3.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# SVG markup templates read better on one line each.
"app/qr/designer.py" = ["E501"]
"app/redirect/pages.py" = ["E501"]  # inline HTML and SVG
"app/imports/*.py" = ["E501"]  # CSV templates and column maps are tables
"app/billing/*.py" = ["E501"]  # CSV headers, tables and Stripe payload shapes
"tests/*.py" = ["E501"]  # long fixtures and assertions read better on one line
"migrations/versions/*.py" = ["E501"]  # one column per line reads better

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
